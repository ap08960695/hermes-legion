name: Verify public artifact
on: [push, pull_request]
permissions:
  contents: read
jobs:
  offline-review:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Test read-only tools and file inventory
        run: |
          python3 -m unittest discover -s tests -v
          python3 scripts/verify_release.py
      - name: Download checksum-pinned secret scanner
        shell: bash
        run: |
          set -euo pipefail
          mkdir "$RUNNER_TEMP/legion-scanner"
          cd "$RUNNER_TEMP/legion-scanner"
          curl --fail --location --silent --show-error --output scanner.tar.gz https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz
          echo '551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb  scanner.tar.gz' | sha256sum --check --status
          tar -xzf scanner.tar.gz gitleaks
      - name: Scan files and all Git history
        shell: bash
        run: |
          set -euo pipefail
          "$RUNNER_TEMP/legion-scanner/gitleaks" dir . --redact=100 --ignore-gitleaks-allow --no-banner
          "$RUNNER_TEMP/legion-scanner/gitleaks" git . --log-opts="--all" --redact=100 --ignore-gitleaks-allow --no-banner
